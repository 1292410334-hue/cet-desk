    <p class="caption">DRILLS · 20 题一轮</p>
    <h1 class="h4">考点练习 · 四种题型，当场判</h1>

    <div id="js-qs"></div>

      <p class="note" style="font-size:12px;margin-top:12px">答错的词会写进单词本的错词本。</p>

  </div>
